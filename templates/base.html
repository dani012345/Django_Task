{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tasks</title>
  <link rel="icon" href="{% static 'icons/tasks_logo.svg' %}" type="image/svg+xml">
  <title>{% block title %}Task Manager{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'assets/bootstrap.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Product+Sans&display=swap" rel="stylesheet">
  <script src="{% static 'assets/bootstrap.bundle.js' %}"></script>
  <style>
    body {  
      font-family: 'Product Sans', sans-serif;
      background-color: #f8f9fa; 
    }

   /* Sidebar o barra lateral */
.sidebar {
  position: fixed;  
  top: 0;  
  left: 0;  
  height: 100vh;
  width: 300px;  
  background-color: #f8f9fa;  
  color: #212529;
  border-right: 1px solid #dee2e6;
  display: flex;  
  flex-direction: column;  
  transition: width 0.3s ease-in-out; 
  z-index: 1; 
}

.sidebar.hidden {
  width: 0; 
  overflow: hidden; 
}

/* Logo */
.sidebar-header {
  display: flex;  
  align-items: center;  
  padding: 1rem;
  flex-shrink: 0;
}

/* menú dentro del sidebar */
#sidebar-menu {
  flex-grow: 1; 
}

#sidebar-menu.hidden {
  width: 0;  
  overflow: hidden; 
}

/* My Task o contenido principal */
.content {
  margin-left: 0;                 
  padding: 2rem;
  transition: margin-left 0.3s ease-in-out;
  z-index: 2;                     
}

/* Ajustar la caja central de My Tasks */
#content .card {
  position: relative;
  top: 40px;          /* mueve hacia abajo */
  left: 171px;         /* mueve hacia la derecha */
  max-width: 1000px;  /* más grande que los 800px actuales */
  width: 100%; 
  min-height: 485px;       /* ocupa todo el ancho disponible hasta el límite */
}

.sidebar-open .content {
  margin-left: 300px;             
}

/* enlaces dentro del sidebar */
.sidebar a {  
  color: #212529;  
  text-decoration: none;  
  display: flex;
  align-items: center;  
  gap: 10px;  
  padding: 0.75rem 1rem;
  border-radius: 4px;
  margin-bottom: 2px;
  line-height: 1;
}

.sidebar a:hover {  
  background-color: #e9ecef;  
  color: #000;  
}

.sidebar h4 {  
  margin-left: 0.5rem;  
}

/* botón hamburguesa */
.menu-toggle {  
  cursor: pointer;  
  font-size: 24px;  
  margin-right: 10px;  
}  

.btn-create {  
  background-color: #fff;  
  border: 1px solid #dee2e6;   
  border-radius: 16px !important;         
  box-shadow: 0 2px 6px rgba(0,0,0,0.15); 
  color: #000;  
  padding: 16px 20px !important;          
  font-weight: 500;  
  display: flex;  
  align-items: center;  
  justify-content: center;  
  gap: 6px;                    
  width: calc(50% - 20px);
}

.btn-create:hover {  
  background-color: #f8f9fa;  
  color: #000;  
}

/* botón tarea */
.btn-task {  
  background-color: #ffffff;
  color: #2854c5;
  border: none;
  border-radius: 25px; 
  font-weight: 500;
  padding: 8px 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.2s ease-in-out;
}

.btn-task:hover {   
  background-color: #f8f9fa;   
}

.btn-task img {  
  margin-right: 8px;  
}

.title-wrapper {
  position: relative;
  padding-left: 50px; 
}

.input-title {
  border: none;
  font-size: 1.5rem;
  font-weight: 500;
  outline: none;
  width: 100%;
}

.title-wrapper::after {
  content: "";
  position: absolute;
  left: 50px;              
  bottom: 0;               
  width: calc(100% - 50px);
  height: 2px;
  background-color: #2854c5;
}

#create-task-pane form .mb-2, 
#create-task-pane form .d-flex, 
#create-task-pane form .form-check {
  padding-left: 50px; 
  margin-bottom: 1.5rem !important;
}

/* Pestañas flotantes base */
.floating-pane {
  display: none;
  position: absolute;  
  right: 20px;  
  left: 20px;
  max-width: 600px;  
  margin: auto;  
  z-index: 1000;  
  background: #fff;
  border-radius: 25px !important;
}

.floating-pane-visible {
  display: block; 
}

/* Ajuste específico para Create Task */
#create-task-pane {
  top: 120px;   
  min-height: 400px;
}

/* Ajuste específico para Create List */
#create-list-pane {
  top: 295px;   
  min-height: 220px;
  max-width: 325px;
}

#create-list-pane .mb-2,.d-flex.justify-content-end  {
  margin-top: 2rem;  /* mueve el campo hacia abajo */
}

/* Línea azul debajo de Enter name */
.input-list-name {
  border: none;
  border-bottom: 2px solid #2854c5;
  border-radius: 0;
  outline: none;
}

.custom-checkbox {
  cursor: pointer;
  display: inline-flex;
  align-items: center;
}

.custom-checkbox input {
  display: none;
}

.checkmark {
  width: 16px;
  height: 16px;
  border: 2px solid #555;
  border-radius: 4px;
  display: inline-block;
  position: relative;
}

.custom-checkbox input:checked + .checkmark::after {
  content: "✔";
  position: absolute;
  top: -2px;
  left: 2px;
  font-size: 14px;
  color: #007bff;
}

  </style>
</head>
<body>

  <!-- Barra superior con íconos -->
  <div class="position-absolute top-0 end-0 p-2 d-flex">
  <!-- Support -->
  <a href="#" class="btn btn-light rounded-circle p-2 me-2">
    <img src="{% static 'icons/support.svg' %}" alt="Support" width="30">
  </a>

  <!-- Apps -->
  <a href="#" class="btn btn-light rounded-circle p-2 me-2">
    <img src="{% static 'icons/apps.svg' %}" alt="Apps" width="30">
  </a>

  <!-- Account -->
  <a href="#" class="btn btn-light rounded-circle p-2">
    <img src="{% static 'icons/account.svg' %}" alt="Account" width="30">
  </a>
</div>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-header">
    <img src="{% static 'icons/menu.svg' %}" alt="Menu" width="25" class="menu-toggle ms-3" onclick="toggleMenu()">
    <img src="{% static 'icons/tasks_logo.svg' %}" alt="Tasks Logo" width="40" class="ms-2">
    <h4 class="ms-1">Tasks</h4>
  </div>
  <div id="sidebar-menu">
    <a href="javascript:void(0)"  
       class="mt-10 btn btn-create d-flex align-items-center justify-content-center mb-4 ms-3 mt-2"
       onclick="toggleCreateTaskPane()">
      <img src="{% static 'icons/add.svg' %}" alt="Create Task" width="30"> Create
    </a>
    <a href="{% url 'task_list' %}" class="ms-3">
      <img src="{% static 'icons/all_task.svg' %}" alt="All Tasks" width="25"> All tasks
    </a>
    <a href="{% url 'starred_tasks' %}" class="ms-3">
      <img src="{% static 'icons/star.svg' %}" alt="Starred" width="25"> Starred
    </a>
    <a href="javascript:void(0)" class="text-decoration-none ms-3 mt-1" onclick="toggleSection('mytasks-submenu')">
      <h6 class="d-inline">Lists</h6>
    </a>
    <div id="mytasks-submenu" class="ms-3 mt-1" style="display:none;">
      <a href="#" class="d-flex align-items-center text-decoration-none">
        <label class="custom-checkbox mb-0">
          <input type="checkbox" id="myTasksCheckbox">
          <span class="checkmark"></span>
        </label>
        <span class="ms-2">My Tasks</span>
      </a>
    </div>
    <a href="javascript:void(0)" class="ms-3" onclick="toggleCreateListPane()">
      <img src="{% static 'icons/add.svg' %}" alt="New List" width="20"> Create new list
    </a>
  </div>
</div>

<!-- Content, pestaña central de My Tasks-->
<div class="content" id="content">
  <div class="card shadow p-4 mb-4" style="max-width:800px; margin:auto; border-radius: 12px;"> <!-- Caja central -->
    <h4 class="mb-3">{% block page_title %}{% endblock %}</h4>
    <div class="d-flex justify-content-start mb-3">
      <button class="btn btn-task" onclick="toggleCreateTaskPane()">
        <img src="{% static 'icons/add_task_logo.svg' %}" alt="Add Task" width="20"> Add Task
      </button>
    </div>
    {% block content %}{% endblock %}
  </div>
</div>

<!-- Pestaña flotante Create Task -->
<div id="create-task-pane" class="card shadow rounded p-4 floating-pane" style="display:none;">
  <div class="d-flex justify-content-end mb-3">
    <button type="button" class="btn-close" aria-label="Close" onclick="toggleCreateTaskPane()"></button>
  </div>
  <form method="post" action="{% url 'task_create' %}">
    {% csrf_token %}
    <div class="mb-2 title-wrapper">
      <input type="text" name="title" class="input-title" placeholder="Add title">
    </div>
    <div class="d-flex gap-2 mb-2">
      <input type="date" name="date" class="form-control" style="max-width:200px;">
      <input type="time" name="time" class="form-control" style="max-width:150px;">
    </div>
    <div class="form-check mb-4">
      <input type="checkbox" class="form-check-input" id="allDay" name="all_day">
      <label class="form-check-label" for="allDay">All day</label>
    </div>
    <div class="mb-2">
      <select name="repeat" class="form-select">
        <option selected>Does not repeat</option>
        <option>Daily</option>
        <option>Weekly</option>
        <option>Monthly</option>
      </select>
    </div>
    <div class="mb-2">
      <textarea name="description" class="form-control" placeholder="Add description"></textarea>
    </div>
    <div class="mb-2">
      <select name="list" class="form-select">
        <option selected>My Tasks</option>
      </select>
    </div>
    <div class="d-flex justify-content-end">
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>

<!-- Pestaña flotante Create List -->
<div id="create-list-pane" class="floating-pane card shadow p-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Create new list</h5>
    <button type="button" class="btn-close" aria-label="Close" onclick="toggleCreateListPane()"></button>
  </div>
  <form method="post" action="{% url 'list_create' %}">
    {% csrf_token %}
    <div class="mb-2">
      <input type="text" name="name" class="form-control input-list-name" placeholder="Enter name">
    </div>
    <div class="d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-link" onclick="toggleCreateListPane()">Cancel</button>
      <button type="submit" class="btn btn-primary">Done</button>
    </div>
  </form>
</div>

<script>
  function toggleSection(id) {
    const section = document.getElementById(id);
    section.style.display = (section.style.display === "none") ? "block" : "none";
  }
  document.getElementById("mytasks-submenu").style.display = "none";

  function toggleMenu() {
    const menu = document.getElementById("sidebar-menu"); // alterna visibilidad del menú
    menu.classList.toggle("hidden"); // alterna la clase en el body para controlar el margen del contenido
    document.body.classList.toggle("sidebar-open");
  }

  // se encarga de mostrar/ocultar el pane de crear tarea
  function toggleCreateTaskPane() {
    const pane = document.getElementById("create-task-pane");
    pane.style.display = (pane.style.display === "none") ? "block" : "none";
  }

  function toggleCreateListPane() {
  const pane = document.getElementById("create-list-pane");
  pane.style.display = (pane.style.display === "none" || pane.style.display === "") ? "block" : "none";
}


</script>

</body>
</html>
