{% extends "base.html" %}
{% block title %}Task Form{% endblock %}
{% block content %}

<div class="card shadow p-4 mb-4" style="max-width:600px; margin:auto;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Task</h5>
    <a href="{% url 'task_list' %}" class="btn-close" aria-label="Close"></a>
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">{{ form.title }}</div>
    <div class="row mb-3">
      <div class="col">{{ form.date }}</div>
      <div class="col">{{ form.time }}</div>
    </div>
    <div class="form-check mb-3">
      {{ form.all_day }}
      <label for="id_all_day" class="form-check-label">All day</label>
    </div>
    <div class="mb-3">{{ form.repeat }}</div>
    <div class="mb-3">{{ form.description }}</div>
    <div class="mb-3">{{ form.list }}</div>
    <div class="text-end">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'task_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
